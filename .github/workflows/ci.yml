name: CI

on:
  pull_request:
    branches:
      - develop
      - main
      - prod-ready

  push:
    branches:
      - develop
      - main
      - prod-ready

jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wisebasket
          POSTGRES_PASSWORD: wisebasket
          POSTGRES_DB: wisebasket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wisebasket -d wisebasket_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: postgresql+asyncpg://wisebasket:wisebasket@localhost:5432/wisebasket_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # The shared pytest run also collects inference redaction tests.
          # Install their lightweight OpenCV dependency without pulling the
          # full CPU PaddleOCR runtime into the API test job.
          pip install 'opencv-contrib-python-headless>=4.10,<4.12'

      - name: Run database migrations
        run: |
          alembic -c config/alembic.ini upgrade head

      - name: Run tests
        run: |
          pytest -c config/pytest.ini -v

  mobile-typecheck:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Run mobile TypeScript check
        run: npm run typecheck
