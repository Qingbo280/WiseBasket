name: Expo Update on Main

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/expo-update-main.yml"

jobs:
  update:
    name: Publish Expo Preview Update
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_BASE_URL: https://wisebasket-prod.up.railway.app
      EXPO_PUBLIC_ASSET_BASE_URL: https://pub-dcfc9899ab7c4365bd3f9442a34680bb.r2.dev

    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Missing EXPO_TOKEN GitHub secret."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Production readiness check
        working-directory: apps/mobile
        run: npm run prod:check

      - name: Publish Expo update
        working-directory: apps/mobile
        run: eas update --branch preview --environment preview --message "Auto update from main ${{ github.sha }}"
