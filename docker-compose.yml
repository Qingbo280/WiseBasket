services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wisebasket
      POSTGRES_USER: wisebasket
      POSTGRES_PASSWORD: wisebasket
    ports:
      - "5432:5432"
    volumes:
      - wisebasket_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wisebasket -d wisebasket"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://wisebasket:wisebasket@postgres:5432/wisebasket
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn services.api.app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir services --reload-dir packages --reload-dir migrations
    volumes:
      - .:/app

volumes:
  wisebasket_postgres:
